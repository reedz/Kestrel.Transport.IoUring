\* Focused recv deferred-flush/resubmit/rearm coverage over the real source
\* path. SqCapacity = 1 and RecvResubmitQueueBounded only scope TLC to the
\* successful single-entry drain/rearm witness; they are not production limits.
\* CONDITIONAL_SCOPE: CONSTRAINT RecvResubmitQueueBounded -- scopes TLC to the successful single-entry recv drain/rearm witness; it is not a production queue limit.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION RecvResubmitFocusedLiveSpec

CONSTANTS
  SlotCount = 1
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100}
  RecvTokenUniverse = {200, 201}
