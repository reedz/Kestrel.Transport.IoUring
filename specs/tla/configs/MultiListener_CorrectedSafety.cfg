\* Repaired-production-behavior structural safety under the real
\* merged-channel capacity relation:
\* MergedCapacity = WorkerCount * WorkerAcceptCapacity = 2 matches
\* Channel.CreateBounded(options.AcceptQueueCapacity * threadCount) in the
\* repaired production behavior. Shutdown-specific drop / quiescence bugs are
\* also checked.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION SafetySpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 2
  ConnectionCount = 3
  Scenario = "safety"
  FixDrainOnUnbind = TRUE

INVARIANT
  TypeOK
  OwnershipPartition
  BoundedChannels
  SharedAdmissionBound
  TotalCapacityExact
  RemainderAllocation
  MergedCapacityWithinSourceBound
  UniqueForwardHistory
  ClosedRefsTerminal
  DroppedRefsSeparate
  DroppedRefsNeverMerged
  UnboundHasNoLiveConnections
  DisposedQuiescesListenerLocations
  DisposedHasNoDroppedRefs

CHECK_DEADLOCK FALSE
