\* Same focused close/release/reaccept witness, but the corrected
\* close/final-release path guarantees the stale cancel-retry marker is purged
\* before the slot is returned to the free list and reused.
\* CONDITIONAL_SCOPE: CONSTRAINT CloseRequestQueueBounded -- keeps TLC on the same one-entry close/reuse witness summarized by SetupCloseReuseReady; it is not a production queue-depth limit.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION CloseReuseFocusedSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = TRUE
  UseRegisteredFiles = TRUE
  Scenario = "structural-safety"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  ReleasedSlotsNoCancelRetryReference
  NoStaleRetryCrossGeneration
  GenerationSafeDispatch
  FixedFileSafety
  FdAccounting

CONSTRAINT
  CloseRequestQueueBounded

CHECK_DEADLOCK FALSE
