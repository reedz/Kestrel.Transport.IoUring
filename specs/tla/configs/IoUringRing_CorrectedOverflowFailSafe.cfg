\* Corrected overflow isolation: CQ-full pressure first accumulates unpublished
\* completions in the kernel backlog, and any loss is modeled only by the
\* separate drop / OOM step rather than by CQ-full => drop. With both submission
\* fixes enabled, this liveness check validates the assumed OverflowCount ->
\* observation -> fail-safe wiring represented by ObserveOverflowAndFail: once
\* overflow becomes visible inside this focused model, the listener-side
\* fail-safe observation must eventually fire.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  SqEntries = 2
  CqEntries = 1
  MaxRequests = 2
  FixEnterSubmitBudget = TRUE
  FixEnterDecision = TRUE

INVARIANT
  TypeOK
  SqCursorRelation
  CqCursorRelation
  SqNoOverwrite
  CqNoOverwrite
  SqExactAccounting
  CqExactAccounting

PROPERTY
  OverflowEventuallyFailsSafe

CHECK_DEADLOCK FALSE
