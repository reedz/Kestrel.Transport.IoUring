\* Focused short-submit witness for the budget-only correction: transient Enter
\* errors are excluded, callers that do enter re-account the full
\* kernel-visible PendingSubmit budget, but they still decide to issue another
\* public Enter call only from the latest Flush result. A documented short
\* successful enter can therefore leave an older ready SQE stranded, so this
\* liveness check is expected to violate FlushedRequestsEventuallySubmitted.
\* CONDITIONAL_SCOPE: ACTION_CONSTRAINT NoTransientEnterErrors -- excludes transient Enter errors so TLC isolates the documented short-successful-enter witness behind this expected liveness failure.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  SqEntries = 2
  CqEntries = 2
  MaxRequests = 2
  FixEnterSubmitBudget = TRUE
  FixEnterDecision = FALSE

INVARIANT
  TypeOK
  SqCursorRelation
  CqCursorRelation
  SqNoOverwrite
  CqNoOverwrite
  SqExactAccounting
  CqExactAccounting

ACTION_CONSTRAINT
  NoTransientEnterErrors

PROPERTY
  FlushedRequestsEventuallySubmitted

CHECK_DEADLOCK FALSE
