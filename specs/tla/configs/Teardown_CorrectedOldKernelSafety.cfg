\* Corrected teardown drain without bulk cancel (Linux 5.10-5.18): the targeted
\* cancels and socket shutdowns must still keep every release safe, including
\* when a request nobody names keeps the ring busy (quarantine).
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BulkCancel = FALSE
  IncludeForeign = TRUE
  Fds = {f1, f2}
  MaxCq = 2
  MutateTrustClose = FALSE
  MutateFreeOnTimeout = FALSE
  MutateCountEveryCqe = FALSE

INVARIANT
  TypeOK
  LedgerCountsLiveRequests
  QuiescedMeansKernelIdle
  NoReleaseWhileKernelOwns
  NoAcceptedFdLeak
  ReleaseOnlyAfterQuiescence

CHECK_DEADLOCK FALSE
