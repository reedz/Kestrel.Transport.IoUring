\* Mutation witness: memory is released without observed quiescence, either the
\* pre-fix order (close the ring fd, trust it to stop the kernel, unmap) or
\* "free after the drain timed out". Kernel- or completion-owned bids are still
\* live, so TLC should violate NoLiveBuffersAfterUnmap rather than merely an
\* ordering check.
\* Invariant order is intentional: NoLiveBuffersAfterUnmap stays ahead of the
\* ordering checks so TLC reports the cataloged lost-live-buffer target first.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BufferUniverse = {b0, b1}
  CqEntries = 1
  MutateDoubleRecycle = FALSE
  MutateLoseRecycle = FALSE
  MutateUnmapBeforeRingClose = FALSE
  MutateFreeWithoutQuiescence = TRUE

SYMMETRY BufferSymmetry

INVARIANT
  TypeOK
  ExclusiveNonRingOwners
  AllBufferConservation
  ValidCompletionSemantics
  RingAvailabilityAccounting
  RingCapacityAndTail
  CqCapacity
  QuiescenceMeansNoKernelOwners
  QuiescenceStopsRecv
  NoLiveBuffersAfterUnmap
  NoUnmapBeforeQuiescence
  NoUnmapBeforeRingClosed
  QuarantineReleasesNothing
  NoRingCloseBeforeQuiescence

CHECK_DEADLOCK FALSE
