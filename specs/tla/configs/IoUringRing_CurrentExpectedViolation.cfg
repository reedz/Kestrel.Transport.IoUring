\* Legacy buggy Ring.Submit behavior with flags = 0: the latest
\* SubmissionQueue.Flush() return controls both whether Ring.Enter is called and
\* its `toSubmit` budget. Any zero-progress Enter outcome (EAGAIN/EBUSY, or
\* EINTR/EEXIST followed by zero-budget retry) can strand ready SQEs. Short
\* success is isolated by the two constrained single-fix configs. This
\* exhaustive check is expected to violate FlushedRequestsEventuallySubmitted.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  SqEntries = 2
  CqEntries = 2
  MaxRequests = 2
  FixEnterSubmitBudget = FALSE
  FixEnterDecision = FALSE

INVARIANT
  TypeOK
  SqCursorRelation
  CqCursorRelation
  SqNoOverwrite
  CqNoOverwrite
  SqExactAccounting
  CqExactAccounting

PROPERTY
  FlushedRequestsEventuallySubmitted

CHECK_DEADLOCK FALSE
