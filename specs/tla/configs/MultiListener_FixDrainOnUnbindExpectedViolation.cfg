\* Legacy pre-fix shutdown twin over the deliberate merged-capacity under-approx
\* (MergedCapacity = 1 < WorkerCount * WorkerAcceptCapacity = 2). This is not a
\* constructor claim; it keeps the explicit three-connection witness reachable
\* via real actions: one merged ref, one queued worker ref, and one full-blocked
\* in-transit ref. This twin and the repaired-production-behavior twin keep
\* identical obligations;
\* only FixDrainOnUnbind differs. TLC coverage for this twin and the
\* repaired-production-behavior twin must still execute the real
\* WorkerAbortQueuedHead and ForwardCancelTransit bodies; only their ownership
\* effects differ. The legacy pre-fix UnbindAsync still cancels the blocked
\* WriteAsync and reaches dispose with silent-discard history, so TLC should
\* violate DisposedHasNoDroppedRefs while the shared witness property still
\* holds. The separate
\* MultiListener_FixDrainOnUnbindLateCompleteExpectedViolation.cfg model
\* isolates the corrected-order mutation that keeps FixDrainOnUnbind = TRUE but
\* delays merged completion until after forwarders. TLC exhaustively checks this
\* bounded temporal model
\* (not -simulate); fairness comes only from the referenced *LiveSpec's
\* environment / forwarder scheduling, and symmetry reduction stays off.
SPECIFICATION ShutdownLiveSpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 1
  ConnectionCount = 3
  Scenario = "shutdown-drain"
  FixDrainOnUnbind = FALSE

