\* Legacy pre-fix structural safety under the exact merged-channel capacity
\* relation from IoUringMultiListener: MergedCapacity = WorkerCount *
\* WorkerAcceptCapacity = 2. This intentionally checks the shared ownership /
\* capacity invariants only; the known shutdown silent-discard history bug is
\* isolated in the focused expected-violation shutdown config.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION SafetySpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 2
  ConnectionCount = 3
  Scenario = "safety"
  FixDrainOnUnbind = FALSE

INVARIANT
  TypeOK
  OwnershipPartition
  BoundedChannels
  WorkerCapacityBound
  TotalCapacityExact
  RemainderAllocation
  MergedCapacityWithinSourceBound
  UniqueForwardHistory
  ClosedRefsTerminal
  DroppedRefsSeparate
  DroppedRefsNeverMerged
  UnboundHasNoLiveConnections

CHECK_DEADLOCK FALSE
