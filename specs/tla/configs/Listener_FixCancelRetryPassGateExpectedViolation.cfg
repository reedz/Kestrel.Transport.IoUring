\* Expected violation for Bug 3's cancel-only retry-pass gate. The focused
\* witness starts from BaseInit, stages only a matching cancel retry, and must
\* traverse ProcessToAfter / AfterRetryCancelOne through the real
\* RetryPassPending gate with recvRetrySet deliberately empty.
\* TLC exhaustively checks this bounded temporal model (not -simulate); fairness
\* comes from CancelRetryPassGateLiveSpec, and the corrected twin changes only
\* FixCancelRetryPassGate.
SPECIFICATION CancelRetryPassGateLiveSpec

