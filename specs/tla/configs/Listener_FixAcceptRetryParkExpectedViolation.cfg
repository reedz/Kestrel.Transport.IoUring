\* Expected liveness violation for the due-now accept-retry park hazard.
\* The focused setup still executes the real ProcessAcceptCqe rearm decision,
\* leaves acceptRetryRequired/acceptRetryDue live after the accepted recv
\* consumes the only SQ slot, and later traverses KernelMakesSqSpace plus the
\* real LoopWaitDecision. With FixAcceptRetryPark disabled, the loop can still
\* park before AfterRetryAccept gets a chance to rearm accept.
\* TLC exhaustively checks this bounded temporal model (not -simulate);
\* fairness comes from AcceptRetryParkFocusedLiveSpec and never names
\* AfterRetryAccept directly.
SPECIFICATION AcceptRetryParkFocusedLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 2
  SqCapacity = 1
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "accept-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = FALSE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FdAccounting

PROPERTY
  AcceptRetryEventuallyRearms

CHECK_DEADLOCK FALSE
