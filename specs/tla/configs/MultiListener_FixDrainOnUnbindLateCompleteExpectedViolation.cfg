\* Focused late-order mutation over the same deliberate merged-capacity
\* under-approx (MergedCapacity = 1 < WorkerCount * WorkerAcceptCapacity = 2).
\* FixDrainOnUnbind stays TRUE so the repaired production behavior itself is
\* unchanged; only Scenario switches to the mutation that delays
\* CompleteMergedWriter until after the forwarders. App accepts still close
\* when unbind starts, so the blocked merged / queued / in-transit witness
\* cannot rely on post-unbind app reads. TLC should therefore violate
\* DisposeEventuallyQuiesces.
SPECIFICATION ShutdownQuiescenceLiveSpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 1
  ConnectionCount = 3
  Scenario = "shutdown-late-merged-complete"
  FixDrainOnUnbind = TRUE

INVARIANT
  TypeOK
  OwnershipPartition
  BoundedChannels
  WorkerCapacityBound
  TotalCapacityExact
  RemainderAllocation
  MergedCapacityWithinSourceBound
  UniqueForwardHistory
  ClosedRefsTerminal
  DroppedRefsSeparate
  DroppedRefsNeverMerged
  UnboundHasNoLiveConnections
  DisposedHasNoDroppedRefs
  DisposedQuiescesListenerLocations

PROPERTY
  DisposeEventuallyQuiesces

CHECK_DEADLOCK FALSE
