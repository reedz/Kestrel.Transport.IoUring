\* Focused recv subsystem coverage over the real accept/recv/backpressure path:
\* ENOBUFS retry, cancel CQE ordering, retry pass, resubmit, and close-on-recv
\* failure all remain reachable without the unrelated listener branches.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION RecvFocusedSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200, 201}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = TRUE
  UseRegisteredFiles = FALSE
  Scenario = "recv-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FixedFileSafety
  RecvTokenOrder
  FdAccounting

CHECK_DEADLOCK FALSE
