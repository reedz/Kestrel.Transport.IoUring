\* Corrected submission behavior for phases 1-2: non-SQPOLL submit-bearing
\* public enters continue while the re-read kernel-visible PendingSubmit budget
\* stays nonzero, and each Ring.Enter budget / retry re-accounts
\* SubmissionQueue.PendingSubmit even after a documented short success or
\* EAGAIN / EBUSY / EINTR / EEXIST outcome. SQPOLL stays intentionally
\* Flush-gated outside this focused model. No symmetry is used because TLC
\* temporal checks should not rely on it.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  SqEntries = 2
  CqEntries = 2
  MaxRequests = 2
  FixEnterSubmitBudget = TRUE
  FixEnterDecision = TRUE

INVARIANT
  TypeOK
  SqCursorRelation
  CqCursorRelation
  SqNoOverwrite
  CqNoOverwrite
  SqExactAccounting
  CqExactAccounting

PROPERTY
  FlushedRequestsEventuallySubmitted

CHECK_DEADLOCK FALSE
