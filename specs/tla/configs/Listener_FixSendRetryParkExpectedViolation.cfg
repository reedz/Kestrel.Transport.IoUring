\* Expected liveness violation for Bug 4's focused send-retry wake-on-request
\* regression. The focused setup still executes the real RequestSendRetry
\* branch and the real LoopWaitDecision predicate, but the legacy twin never
\* publishes an eventfd wake. Fairness stays on the focused wake/scheduler
\* slice and never names AfterResumeSend directly.
SPECIFICATION SendRetryParkFocusedLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 2
  SqCapacity = 1
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {300}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "send-retry"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = FALSE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SendTokenOrder
  SendPinSafety
  FdAccounting

PROPERTY
  SendRetryEventuallyResumes

CHECK_DEADLOCK FALSE
