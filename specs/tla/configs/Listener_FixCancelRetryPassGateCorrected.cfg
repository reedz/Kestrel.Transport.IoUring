\* Same cancel-only retry-pass witness, but the corrected pass gate admits the
\* matching cancel retry after ProcessToAfter computes RetryPassPending from a
\* cancel-only retry set.
\* TLC exhaustively checks this bounded temporal model (not -simulate); fairness
\* comes from CancelRetryPassGateLiveSpec, and this twin differs from the
\* expected-violation config only by FixCancelRetryPassGate.
SPECIFICATION CancelRetryPassGateLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = TRUE
  UseRegisteredFiles = FALSE
  Scenario = "recv-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FixedFileSafety
  RecvTokenOrder
  FdAccounting

PROPERTY
  MatchingCancelRetryEventuallyIssuesOrResolves

CHECK_DEADLOCK FALSE
