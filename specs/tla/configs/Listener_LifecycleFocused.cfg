\* Full-action lifecycle subsystem coverage: app close/abort, unbind,
\* fail-ring, timeout stop, dispose, and accepted-CQE leak accounting.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 2
  SqCapacity = 2
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101, 102}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "lifecycle-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FdAccounting
  RingCloseAfterDisposeDrain
  UnbindAloneKeepsLoopRunning

CHECK_DEADLOCK FALSE
