\* Corrected phase-3 receive-control liveness model: same tiny power-of-two
\* bounds, no symmetry reduction, and fairness only on explicit environment
\* assumptions (deferred-flush / cancel resolution plus eventual
\* KernelTeardownComplete after ring-fd close). That teardown fairness is only
\* a shutdown assumption; it cannot hide ordinary pre-close transport bugs.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  BufferUniverse = {b0, b1}
  CqEntries = 1
  MutateDoubleRecycle = FALSE
  MutateLoseRecycle = FALSE
  MutateUnmapBeforeRingClose = FALSE
  MutateUnmapBeforeTeardown = FALSE

INVARIANT
  TypeOK
  ExclusiveNonRingOwners
  AllBufferConservation
  ValidCompletionSemantics
  RingAvailabilityAccounting
  RingCapacityAndTail
  CqCapacity
  KernelTeardownReclaimsKernelOwners
  KernelTeardownStopsRecv
  NoLiveBuffersAfterUnmap
  NoUnmapBeforeKernelTeardown
  NoUnmapBeforeRingClosed

PROPERTY
  ReceiveEventuallyRearmable

CHECK_DEADLOCK FALSE
