\* Expected liveness violation for the due-now retry-pass park hazard.
\* The focused setup still executes the real ProcessRecvCqe SQ-full receive
\* rearm miss, the real retry-pass submit that latches
\* recvRetryPassBlockedOnSq on SQ-full, and later traverses KernelMakesSqSpace
\* plus the real LoopWaitDecision with no timer-backed wake left to rescue the
\* loop. With FixRetryPassPark disabled, the loop can still park before the
\* next retry pass or LoopSubmitStaged run.
\* TLC exhaustively checks this bounded temporal model (not -simulate);
\* fairness comes from RetryPassParkFocusedLiveSpec and never names
\* AfterRetryRecvOne or LoopSubmitStaged directly.
SPECIFICATION RetryPassParkFocusedLiveSpec

CONSTANTS
  SlotCount = 1
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "receive-liveness"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = FALSE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FixedFileSafety
  RecvTokenOrder
  FdAccounting

PROPERTY
  ReceiveRetryPassEventuallyArms

CHECK_DEADLOCK FALSE
