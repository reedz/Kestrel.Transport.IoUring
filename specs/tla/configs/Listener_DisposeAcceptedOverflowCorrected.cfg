\* Same focused hidden-overflow dispose witness, but the twin now differs only
\* by FixDisposeOverflowDrain. With the flag enabled and guaranteed progress,
\* the shared body alternates bounded drain/materialize rounds until every
\* tracked hidden overflow accept that fits within the fixed round cap is
\* reclaimed.
\* TLC exhaustively checks this bounded safety model (not -simulate).
SPECIFICATION DisposeAcceptedOverflowFocusedSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101, 102, 103, 104}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "dispose-accepted-overflow-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FdAccounting
  RingCloseAfterDisposeDrain
  DisposeOverflowTrackedAcceptedFdsReleased

CHECK_DEADLOCK FALSE
