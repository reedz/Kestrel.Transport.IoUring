\* Same focused Bug 4 witness, but FixSendRetryPark now makes the real
\* RequestSendRetry branch publish an eventfd wake. LoopWaitDecision may still
\* park; fair kernel eventfd completion then drives the same focused wake path.
\* The legacy twin and this corrected twin differ only by FixSendRetryPark,
\* and fairness still comes from the focused wake/scheduler slice rather than
\* AfterResumeSend directly.
SPECIFICATION SendRetryParkFocusedLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 2
  SqCapacity = 1
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {300}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "send-retry"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SendTokenOrder
  SendPinSafety
  FdAccounting

PROPERTY
  SendRetryEventuallyResumes

CHECK_DEADLOCK FALSE
