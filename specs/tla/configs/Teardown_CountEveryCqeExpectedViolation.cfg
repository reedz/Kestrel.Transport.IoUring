\* Mutation witness: a ledger that counts every completion instead of only those
\* without IORING_CQE_F_MORE reaches zero while a multishot request is still
\* armed, so TLC should violate QuiescedMeansKernelIdle. LedgerCountsLiveRequests
\* is left out so the consequence, not the bookkeeping, is what TLC reports.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BulkCancel = TRUE
  IncludeForeign = FALSE
  Fds = {f1, f2}
  MaxCq = 2
  MutateTrustClose = FALSE
  MutateFreeOnTimeout = FALSE
  MutateCountEveryCqe = TRUE

INVARIANT
  TypeOK
  QuiescedMeansKernelIdle
  NoReleaseWhileKernelOwns
  NoAcceptedFdLeak

CHECK_DEADLOCK FALSE
