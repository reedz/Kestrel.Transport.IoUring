\* Same focused retry-pass park witness, but FixRetryPassPark now keeps
\* LoopWaitDecision from parking once recvRetryPassBlockedOnSq proves a real
\* retry-pass submit lost to SQ-full and is the only remaining work after
\* SQ-space recovery.
\* TLC exhaustively checks this bounded temporal model (not -simulate);
\* fairness still comes from RetryPassParkFocusedLiveSpec and this twin
\* differs from the expected-violation config only by FixRetryPassPark.
SPECIFICATION RetryPassParkFocusedLiveSpec

CONSTANTS
  SlotCount = 1
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "receive-liveness"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FixedFileSafety
  RecvTokenOrder
  FdAccounting

PROPERTY
  ReceiveRetryPassEventuallyArms

CHECK_DEADLOCK FALSE
