\* Focused Bug 5 eventfd rearm/park regression with the documented retry/rearm
\* fix enabled. SetupEventFdWakeReady now starts with the listener parked on an
\* armed eventfd read plus one pending wake, and the focused body must traverse
\* KernelCompleteEventfd, ProcessEventfdCqe's SQ-full rearm failure, later
\* KernelMakesSqSpace, and the real LoopWaitDecision before the corrected
\* wait policy keeps the loop from parking while that retry-required,
\* no-read-armed state is still outstanding.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION EventFdWakeFocusedLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 2
  SqCapacity = 1
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300, 301}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "eventfd-wake"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SendTokenOrder
  FdAccounting

PROPERTY
  EventFdWakeEventuallyDrains

CHECK_DEADLOCK FALSE
