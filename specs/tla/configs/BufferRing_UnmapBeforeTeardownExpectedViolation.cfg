\* Mutation witness: the ring fd is already closed, but the model unmaps before
\* KernelTeardownComplete reclaimed outstanding kernel/completion-owned bids, so
\* TLC should violate NoLiveBuffersAfterUnmap rather than merely close-ordering.
\* Invariant order is intentional: NoLiveBuffersAfterUnmap stays ahead of the
\* close-ordering checks so TLC reports the cataloged lost-live-buffer target
\* first.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BufferUniverse = {b0, b1}
  CqEntries = 1
  MutateDoubleRecycle = FALSE
  MutateLoseRecycle = FALSE
  MutateUnmapBeforeRingClose = FALSE
  MutateUnmapBeforeTeardown = TRUE

