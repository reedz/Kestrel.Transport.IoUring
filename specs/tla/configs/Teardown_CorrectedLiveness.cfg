\* With bulk cancel every request is reachable, so the drain gets the ring idle
\* by itself (the deadline has no fairness). Fairness: the drain keeps consuming,
\* re-issuing cancels and observing the ledger; the kernel eventually completes a
\* request a cancel keeps applying to.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  BulkCancel = TRUE
  IncludeForeign = TRUE
  Fds = {f1, f2}
  MaxCq = 2
  MutateTrustClose = FALSE
  MutateFreeOnTimeout = FALSE
  MutateCountEveryCqe = FALSE

INVARIANT
  TypeOK
  LedgerCountsLiveRequests
  NoReleaseWhileKernelOwns

PROPERTY
  DrainEnds

CHECK_DEADLOCK FALSE
