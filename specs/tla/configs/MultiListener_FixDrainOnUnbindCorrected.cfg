\* Repaired-production-behavior shutdown twin over the same deliberate
\* merged-capacity under-approx
\* (MergedCapacity = 1 < WorkerCount * WorkerAcceptCapacity = 2). This is not a
\* constructor claim; it keeps the same explicit three-connection witness:
\* one merged ref, one queued worker ref, and one full-blocked in-transit ref.
\* This twin and the legacy pre-fix twin keep identical obligations; only
\* FixDrainOnUnbind differs. TLC coverage for this twin and the legacy twin must
\* still execute the real WorkerAbortQueuedHead and ForwardCancelTransit bodies;
\* only their ownership effects differ. With the repaired production behavior enabled,
\* CompleteMergedWriter now fires at unbind start, so blocked or later
\* in-transit writes always take the explicit dispose path and unread merged
\* backlog drains without assuming post-unbind app reads. The late-order
\* mutation that delays that completion lives in the separate
\* MultiListener_FixDrainOnUnbindLateCompleteExpectedViolation.cfg model.
\* The stronger repaired-production-only quiescence proof lives in the separate
\* MultiListener_FixDrainOnUnbindCorrectedQuiescence.cfg model.
\* TLC exhaustively checks this bounded temporal model (not -simulate);
\* fairness comes only from the referenced *LiveSpec's environment / forwarder
\* scheduling, and symmetry reduction stays off.
SPECIFICATION ShutdownLiveSpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 1
  ConnectionCount = 3
  Scenario = "shutdown-drain"
  FixDrainOnUnbind = TRUE

INVARIANT
  TypeOK
  OwnershipPartition
  BoundedChannels
  SharedAdmissionBound
  TotalCapacityExact
  RemainderAllocation
  MergedCapacityWithinSourceBound
  UniqueForwardHistory
  ClosedRefsTerminal
  DroppedRefsSeparate
  DroppedRefsNeverMerged
  UnboundHasNoLiveConnections
  DisposedHasNoDroppedRefs
  DisposedQuiescesListenerLocations

PROPERTY
  EventuallyShutdownDisposeWitness

CHECK_DEADLOCK FALSE
