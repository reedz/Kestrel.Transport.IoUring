\* Corrected teardown drain: bulk cancel available (Linux 5.19+) and a request
\* the listener does not name. Memory is released only after the operation
\* ledger was observed at zero; a drain that misses its deadline quarantines.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BulkCancel = TRUE
  IncludeForeign = TRUE
  Fds = {f1, f2}
  MaxCq = 2
  MutateTrustClose = FALSE
  MutateFreeOnTimeout = FALSE
  MutateCountEveryCqe = FALSE

INVARIANT
  TypeOK
  LedgerCountsLiveRequests
  QuiescedMeansKernelIdle
  NoReleaseWhileKernelOwns
  NoAcceptedFdLeak
  ReleaseOnlyAfterQuiescence

CHECK_DEADLOCK FALSE
