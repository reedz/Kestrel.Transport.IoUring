\* Repaired-production-only shutdown quiescence proof over the same deliberate
\* merged-capacity under-approx (MergedCapacity = 1 <
\* WorkerCount * WorkerAcceptCapacity = 2). Unlike the shared shutdown witness
\* twin, this config uses ShutdownQuiescenceLiveSpec's extra WF on owner-side
\* drain, app release, and lifecycle completion steps so TLC can prove that,
\* once dispose starts, the repaired production behavior's early
\* CompleteMergedWriter step still reaches disposed with no live
\* listener-owned references and no silent drops. It also keeps the shared
\* EventuallyShutdownDisposeWitness property so the stronger liveness proof
\* still demonstrates the same blocked merged / queued / in-transit shutdown
\* prefix.
\* That stronger fairness is an explicit scheduler assumption for these
\* synthetic cleanup moves and does not weaken the fairness-free safety twins.
SPECIFICATION ShutdownQuiescenceLiveSpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 1
  ConnectionCount = 3
  Scenario = "shutdown-drain"
  FixDrainOnUnbind = TRUE

INVARIANT
  TypeOK
  OwnershipPartition
  BoundedChannels
  SharedAdmissionBound
  TotalCapacityExact
  RemainderAllocation
  MergedCapacityWithinSourceBound
  UniqueForwardHistory
  ClosedRefsTerminal
  DroppedRefsSeparate
  DroppedRefsNeverMerged
  UnboundHasNoLiveConnections
  DisposedHasNoDroppedRefs
  DisposedQuiescesListenerLocations

PROPERTY
  EventuallyShutdownDisposeWitness
  UnbindEventuallyCompletes
  DisposeEventuallyQuiesces

CHECK_DEADLOCK FALSE
