\* Focused forwarding liveness under the exact production merged-channel capacity
\* relation. Real create / publish / take / enqueue actions must witness an
\* in-transit handoff, merged publication, and eventual application ownership.
\* No symmetry is used in this temporal check.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION ProgressLiveSpec

CONSTANTS
  WorkerCount = 2
  TotalMaxConnections = 3
  WorkerAcceptCapacity = 1
  MergedCapacity = 2
  ConnectionCount = 1
  Scenario = "forward-progress"
  FixDrainOnUnbind = TRUE

INVARIANT
  TypeOK
  OwnershipPartition
  BoundedChannels
  SharedAdmissionBound
  TotalCapacityExact
  RemainderAllocation
  MergedCapacityWithinSourceBound
  UniqueForwardHistory
  ClosedRefsTerminal
  DroppedRefsSeparate
  DroppedRefsNeverMerged

PROPERTY
  EventuallyInTransitWitness
  EventuallyMergedWitness
  TransitEventuallyAccepted

CHECK_DEADLOCK FALSE
