\* Corrected phase-3 safety model: two buffers (the smallest nontrivial
\* power-of-two ring), one CQ slot, and no mutations. Memory is released only
\* after the operation ledger was observed at zero (ObserveQuiescence); closing
\* the ring fd is given no reclaiming power, and a ring that never quiesces is
\* quarantined. Deadlock checking stays off because quiescent close/cleanup
\* endpoints are modeled via stuttering.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BufferUniverse = {b0, b1}
  CqEntries = 1
  MutateDoubleRecycle = FALSE
  MutateLoseRecycle = FALSE
  MutateUnmapBeforeRingClose = FALSE
  MutateFreeWithoutQuiescence = FALSE

SYMMETRY BufferSymmetry

INVARIANT
  TypeOK
  ExclusiveNonRingOwners
  AllBufferConservation
  ValidCompletionSemantics
  RingAvailabilityAccounting
  RingCapacityAndTail
  CqCapacity
  QuiescenceMeansNoKernelOwners
  QuiescenceStopsRecv
  NoLiveBuffersAfterUnmap
  NoUnmapBeforeQuiescence
  NoUnmapBeforeRingClosed
  QuarantineReleasesNothing
  NoRingCloseBeforeQuiescence

CHECK_DEADLOCK FALSE
