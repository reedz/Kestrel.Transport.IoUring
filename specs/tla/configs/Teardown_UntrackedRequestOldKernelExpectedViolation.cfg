\* Expected violation: without bulk cancel a request the listener does not name
\* never ends, so the drain cannot reach quiescence by itself. This is why the
\* drain has a deadline and the ring is quarantined (not released) when it fires.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  BulkCancel = FALSE
  IncludeForeign = TRUE
  Fds = {f1, f2}
  MaxCq = 2
  MutateTrustClose = FALSE
  MutateFreeOnTimeout = FALSE
  MutateCountEveryCqe = FALSE

INVARIANT
  TypeOK
  LedgerCountsLiveRequests
  NoReleaseWhileKernelOwns

PROPERTY
  DrainEnds

CHECK_DEADLOCK FALSE
