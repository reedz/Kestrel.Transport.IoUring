\* Close/reuse reachability witnesses over the corrected structural-safety
\* scenario. These properties make the stale-dispatch, fixed-file, recv-token,
\* slot-release, and slot-reuse paths non-vacuous under fairness.
\* CONDITIONAL_SCOPE: CONSTRAINT CloseRequestQueueBounded -- scopes TLC to bounded close/reuse witness paths that keep these reachability properties non-vacuous; it is not a production queue-depth limit.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION CloseReuseFocusedLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = TRUE
  UseRegisteredFiles = TRUE
  Scenario = "structural-safety"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FixedFileSafety
  RecvTokenOrder
  FdAccounting

PROPERTY
  EventuallyStaleRecvDispatch
  EventuallyFixedFileConnection
  EventuallyRecvTokenObserved
  EventuallySlotReleased
  EventuallySlotReused

CONSTRAINT
  CloseRequestQueueBounded

CHECK_DEADLOCK FALSE
