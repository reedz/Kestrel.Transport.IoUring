\* Focused hidden-overflow termination witness: the setup still leaves one
\* accepted fd visible in cqQueue, but now the hidden overflow backlog may need
\* more than the fixed round cap or may stop making progress entirely. With
\* guaranteed progress disabled, the shared body must still terminate in a
\* bounded way without falsely requiring every tracked hidden accept to be
\* reclaimed.
\* TLC exhaustively checks this bounded safety model (not -simulate).
SPECIFICATION DisposeAcceptedOverflowFocusedSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 1
  ConnFdUniverse = {100, 101, 102, 103, 104, 105}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = FALSE
  UseRegisteredFiles = FALSE
  Scenario = "dispose-accepted-overflow-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = FALSE

INVARIANT
  TypeOK
  SlotPartition
  RingCloseAfterDisposeDrain
  DisposeOverflowTrackedAcceptedFdsReleased

CHECK_DEADLOCK FALSE
