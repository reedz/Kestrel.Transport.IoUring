\* Focused short-submit witness with both corrections: under the same
\* no-transient-error constraint used by the partial-fix configs, a documented
\* short successful enter must be repaired by a later public submit attempt that
\* both decides to run from the re-read PendingSubmit budget and re-accounts
\* the remaining ready SQE.
\* CONDITIONAL_SCOPE: ACTION_CONSTRAINT NoTransientEnterErrors -- excludes transient Enter errors so TLC isolates the documented short-successful-enter witness; it is not a production availability assumption.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  SqEntries = 2
  CqEntries = 2
  MaxRequests = 2
  FixEnterSubmitBudget = TRUE
  FixEnterDecision = TRUE

INVARIANT
  TypeOK
  SqCursorRelation
  CqCursorRelation
  SqNoOverwrite
  CqNoOverwrite
  SqExactAccounting
  CqExactAccounting

ACTION_CONSTRAINT
  NoTransientEnterErrors

PROPERTY
  FlushedRequestsEventuallySubmitted

CHECK_DEADLOCK FALSE
