\* Focused cancel-retry liveness over the real AfterRetryCancelOne issue path.
\* The witness starts from a live recv, stages a retry-origin cancel, and then
\* requires the issued cancel to preserve its recorded origin and complete
\* safely.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION CancelRetryFocusedLiveSpec

CONSTANTS
  SlotCount = 2
  AcceptQueueCapacity = 1
  SqCapacity = 1
  PendingRecvCap = 2
  ConnFdUniverse = {100, 101}
  RecvTokenUniverse = {200}
  SendTokenUniverse = {300}
  LargeSendTokens = {}
  UseBufferRing = TRUE
  UseRegisteredFiles = FALSE
  Scenario = "recv-focused"
  FixCancelRetryGate = TRUE
  FixCancelRetryPassGate = TRUE
  FixAcceptRetryPark = TRUE
  FixRetryPassPark = TRUE
  FixSendRetryPark = TRUE
  FixEventFdRearmPark = TRUE
  FixStaleCancelSetOnClose = TRUE
  FixDisposeAcceptedCqeLeak = TRUE
  FixDisposeOverflowDrain = TRUE
  DisposeOverflowGuaranteedProgress = TRUE

INVARIANT
  TypeOK
  SlotPartition
  FixedFileSafety
  RecvTokenOrder
  FdAccounting

PROPERTY
  EventuallyCancelRetryIssued
  CancelRetryIssuedFromOrigin
  CancelRetryEventuallySafe

CHECK_DEADLOCK FALSE
