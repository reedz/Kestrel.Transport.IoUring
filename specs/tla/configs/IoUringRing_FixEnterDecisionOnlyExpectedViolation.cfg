\* Legacy decision-only partial correction: Ring.SubmitAndWait keeps issuing
\* submit-bearing Ring.Enter calls while the re-read kernel-visible pending
\* budget remains nonzero, but Ring.Enter still receives only the latest
\* SubmissionQueue.Flush() count as its budget. Transient Enter errors are
\* excluded to isolate a documented short successful enter; later
\* SubmitAndWait calls can spin with zero budget, so this check is expected to
\* violate FlushedRequestsEventuallySubmitted.
\* CONDITIONAL_SCOPE: ACTION_CONSTRAINT NoTransientEnterErrors -- excludes transient Enter errors so TLC isolates the documented short-successful-enter witness behind this expected liveness failure.
\* TLC exhaustively checks this bounded temporal model (not -simulate); any
\* fairness assumption comes from the referenced *LiveSpec in the module, and
\* symmetry reduction stays off.
SPECIFICATION LiveSpec

CONSTANTS
  SqEntries = 2
  CqEntries = 2
  MaxRequests = 2
  FixEnterSubmitBudget = FALSE
  FixEnterDecision = TRUE

INVARIANT
  TypeOK
  SqCursorRelation
  CqCursorRelation
  SqNoOverwrite
  CqNoOverwrite
  SqExactAccounting
  CqExactAccounting

ACTION_CONSTRAINT
  NoTransientEnterErrors

PROPERTY
  FlushedRequestsEventuallySubmitted

CHECK_DEADLOCK FALSE
