\* Mutation witness: release memory once the drain deadline passes instead of
\* quarantining (a bounded drain followed by an unconditional free). A request
\* can still be live, so TLC should violate NoReleaseWhileKernelOwns.
\* ReleaseOnlyAfterQuiescence is left out so the memory-safety consequence is
\* what TLC reports.
\* TLC exhaustively checks this bounded safety model (not -simulate); any
\* "focused" or witness wording here names the scenario, not a simulation
\* run.
SPECIFICATION Spec

CONSTANTS
  BulkCancel = TRUE
  IncludeForeign = TRUE
  Fds = {f1, f2}
  MaxCq = 2
  MutateTrustClose = FALSE
  MutateFreeOnTimeout = TRUE
  MutateCountEveryCqe = FALSE

INVARIANT
  TypeOK
  NoReleaseWhileKernelOwns
  LedgerCountsLiveRequests
  NoAcceptedFdLeak

CHECK_DEADLOCK FALSE
